<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CirCA by RB">

    <!-- ICONOS Y MANIFIESTO PARA ANDROID -->
    <link rel="icon" type="image/jpeg" sizes="192x192" href="Logo.jpg">
    <link rel="icon" type="image/jpeg" sizes="512x512" href="Logo.jpg">
    <link rel="apple-touch-icon" href="Logo.jpg">
    <link rel="manifest" id="my-manifest-placeholder">

    <!-- LIBRERÍA EXTERNA PARA ESCANEAR CÓDIGOS DE BARRAS Y QR -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <title>CirCA by RB - Gestión Empresarial</title>
    <style>
        /* ==========================================
           1. VARIABLES DE COLOR (CIRCA BY RB)
           ========================================== */
        :root {
            --bg-dark: #121212;
            --bg-panel: #1E1E1E;
            --bg-card: #252525;
            --gold-main: #C5A059;
            --gold-light: #EED9A4;
            --gold-dark: #8C6D32;
            --text-light: #F5F5F5;
            --text-muted: #BDBDBD;
            --border-color: #383020;
            --danger: #e74c3c;
            --success: #2ecc71;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            padding-bottom: 90px;
        }

        /* CABECERA */
        header {
            background: linear-gradient(180deg, #0a0a0a 0%, var(--bg-panel) 100%);
            border-bottom: 2px solid var(--gold-main);
            padding: 15px;
            text-align: center;
        }

        .app-logo {
            width: 85px;
            height: 85px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid var(--gold-main);
            box-shadow: 0 4px 12px rgba(197, 160, 89, 0.3);
            margin-bottom: 6px;
        }

        header h1 {
            color: var(--gold-light);
            letter-spacing: 3px;
            font-family: 'Georgia', serif;
            font-size: 1.4rem;
        }

        header p {
            color: var(--gold-main);
            font-size: 0.85rem;
            margin-top: 3px;
        }

        .backup-bar {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-small {
            background-color: var(--bg-dark);
            color: var(--gold-light);
            border: 1px solid var(--gold-main);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-small:hover {
            background-color: var(--gold-main);
            color: #000;
        }

        /* NAVEGACIÓN */
        nav {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 90;
            scrollbar-width: none;
        }
        nav::-webkit-scrollbar { display: none; }

        nav button {
            flex: 0 0 auto;
            background: none;
            border: none;
            color: var(--text-light);
            padding: 14px 16px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            border-bottom: 3px solid transparent;
        }

        nav button.active {
            color: var(--gold-light);
            border-bottom: 3px solid var(--gold-main);
            background-color: rgba(197, 160, 89, 0.15);
        }

        /* CONTENEDOR PRINCIPAL Y BARRA DE HERRAMIENTAS */
        .container {
            max-width: 1250px;
            margin: 15px auto;
            padding: 0 12px;
        }

        .toolbar {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .toolbar-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .toolbar-top h2 {
            color: var(--gold-light);
            font-family: 'Georgia', serif;
            font-size: 1.3rem;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--gold-main), var(--gold-dark));
            color: #000;
            border: none;
            padding: 10px 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }

        .filter-item {
            display: flex;
            flex-direction: column;
        }

        .filter-item label {
            font-size: 0.75rem;
            color: var(--gold-main);
            margin-bottom: 3px;
        }

        .filter-item input, .filter-item select {
            background-color: var(--bg-dark);
            border: 1px solid var(--gold-dark);
            color: var(--text-light);
            padding: 8px 10px;
            border-radius: 5px;
            font-size: 0.85rem;
        }

        /* ==========================================
           2. DISEÑO DE CUADRÍCULA (CATÁLOGO) Y LISTADOS
           ========================================== */
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 18px;
        }

        .catalog-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: transform 0.2s;
        }

        .catalog-card:hover {
            border-color: var(--gold-main);
        }

        .catalog-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #111;
            border-bottom: 1px solid var(--border-color);
        }

        .catalog-body {
            padding: 12px;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .badge-disponible { background-color: rgba(46, 204, 113, 0.2); color: var(--success); border: 1px solid var(--success); }
        .badge-vendido { background-color: rgba(231, 76, 60, 0.2); color: var(--danger); border: 1px solid var(--danger); }

        .catalog-ref {
            color: var(--gold-main);
            font-size: 0.8rem;
            font-weight: bold;
        }

        .catalog-title {
            color: var(--gold-light);
            font-size: 1.05rem;
            margin: 4px 0 8px 0;
            font-weight: bold;
        }

        .catalog-prices {
            display: flex;
            justify-content: space-between;
            background-color: var(--bg-dark);
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .catalog-details {
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .list-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--gold-main);
            border-radius: 6px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .list-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .list-card-title {
            color: var(--gold-light);
            font-size: 1.05rem;
            font-weight: bold;
        }

        .list-card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 8px;
            font-size: 0.85rem;
        }

        .field-item strong {
            color: var(--gold-main);
            display: block;
            font-size: 0.75rem;
        }

        .card-actions {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            padding-top: 8px;
            border-top: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        /* ==========================================
           3. VENTANA MODAL PARA FORMULARIOS Y ESCÁNER
           ========================================== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: flex-start;
            z-index: 200;
            overflow-y: auto;
            padding: 20px 10px;
        }

        .modal-box {
            background-color: var(--bg-panel);
            border: 2px solid var(--gold-main);
            border-radius: 8px;
            width: 100%;
            max-width: 800px;
            padding: 20px;
            position: relative;
            margin: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--gold-dark);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .modal-header h3 {
            color: var(--gold-light);
            font-family: 'Georgia', serif;
        }

        .btn-close {
            background: none;
            border: none;
            color: var(--gold-light);
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* FORMULARIOS */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 12px;
            margin-bottom: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.8rem;
            color: var(--gold-main);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .form-group input, .form-group select {
            background-color: var(--bg-dark);
            border: 1px solid var(--gold-dark);
            color: var(--text-light);
            padding: 10px;
            border-radius: 5px;
            font-size: 15px;
        }

        .form-group input[readonly] {
            background-color: #2a2418;
            color: var(--gold-light);
            font-weight: bold;
        }

        .input-with-scanner {
            display: flex;
            gap: 5px;
        }
        .input-with-scanner input { flex: 1; }

        .measures-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .measures-group input { width: 31%; }

        .conditional-box {
            grid-column: 1 / -1;
            background-color: rgba(197, 160, 89, 0.08);
            border: 1px dashed var(--gold-main);
            padding: 12px;
            border-radius: 6px;
            display: none;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            margin-top: 18px;
            color: var(--gold-light) !important;
        }
        .checkbox-label input { width: 20px; height: 20px; accent-color: var(--gold-main); }

        #reader {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }

        .empty-msg {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-style: italic;
        }

        @media (min-width: 768px) {
            nav { justify-content: center; }
        }
    </style>
</head>
<body>

<header>
    <img src="Logo.jpg" alt="Logo CirCA by RB" class="app-logo" onerror="this.style.display='none'">
    <h1>CIRCA BY R.B</h1>
    <p id="active-company-display">Empresa activa: CirCA by RB</p>
    <div class="backup-bar">
        <button class="btn-small" onclick="exportarDatos()">📥 Copia Seguridad (JSON)</button>
        <button class="btn-small" onclick="document.getElementById('import-file').click()">📤 Restaurar Copia</button>
        <input type="file" id="import-file" style="display:none" accept=".json" onchange="importarDatos(event)">
    </div>
</header>

<nav>
    <button class="active" onclick="switchTab('catalogo', this)">1. CATÁLOGO</button>
    <button onclick="switchTab('empresa', this)">2. EMPRESA</button>
    <button onclick="switchTab('proveedores', this)">3. PROVEEDORES</button>
    <button onclick="switchTab('clientes', this)">4. CLIENTES</button>
    <button onclick="switchTab('compras', this)">5. COMPRAS</button>
    <button onclick="switchTab('ventas', this)">6. VENTAS</button>
    <button onclick="switchTab('gastos', this)">7. GASTOS</button>
</nav>

<div class="container">

    <!-- BARRA DE HERRAMIENTAS COMÚN -->
    <div class="toolbar">
        <div class="toolbar-top">
            <h2 id="section-title">Catálogo de Artículos</h2>
            <div class="action-buttons">
                <button class="btn-primary" onclick="openFormModal()">➕ Nuevo Registro</button>
                <button class="btn-small" onclick="exportSectionCSV()">📊 Excel (Listado)</button>
                <button class="btn-small" onclick="printSectionPDF()">🖨️ PDF (Listado)</button>
            </div>
        </div>

        <!-- FILTROS Y ORDENACIÓN -->
        <div class="filters-grid">
            <div class="filter-item">
                <label>🔍 Buscar en cualquier campo</label>
                <input type="text" id="filter-search" placeholder="Ref, nombre, SKU, cliente, estado..." oninput="renderCurrentTab()">
            </div>
            <div class="filter-item">
                <label>📅 Fecha Desde</label>
                <input type="date" id="filter-date-from" onchange="renderCurrentTab()">
            </div>
            <div class="filter-item">
                <label>📅 Fecha Hasta</label>
                <input type="date" id="filter-date-to" onchange="renderCurrentTab()">
            </div>
            <div class="filter-item">
                <label>↕️ Ordenar por</label>
                <select id="sort-field" onchange="renderCurrentTab()">
                    <option value="none">-- Orden de registro --</option>
                    <option value="fecha">Fecha</option>
                    <option value="ref">Referencia / Código</option>
                    <option value="sku">SKU</option>
                </select>
            </div>
            <div class="filter-item">
                <label>Dirección de orden</label>
                <select id="sort-dir" onchange="renderCurrentTab()">
                    <option value="asc">Ascendente (A-Z / Antiguo)</option>
                    <option value="desc">Descendente (Z-A / Reciente)</option>
                </select>
            </div>
            <div class="filter-item" style="justify-content: flex-end;">
                <button class="btn-small" onclick="clearFilters()">🧹 Limpiar Filtros</button>
            </div>
        </div>
    </div>

    <!-- CONTENEDOR DINÁMICO DE CUADRÍCULA O LISTADOS -->
    <div id="main-list-view"></div>

</div>

<!-- ==========================================
     MODAL DE FORMULARIOS (CREAR / EDITAR)
     ========================================== -->
<div id="form-modal" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-header">
            <h3 id="modal-title">Nuevo Registro</h3>
            <button class="btn-close" onclick="closeFormModal()">✖</button>
        </div>

        <!-- FORMULARIO 1: CATÁLOGO -->
        <form id="form-catalogo" class="tab-form" onsubmit="saveRecord(event, 'catalogo')" style="display:none;">
            <div class="form-grid">
                <div class="form-group"><label>Referencia *</label><input type="text" id="cat-ref" required></div>
                <div class="form-group"><label>SKU</label><input type="text" id="cat-sku"></div>
                <div class="form-group"><label>Nombre *</label><input type="text" id="cat-nombre" required></div>
                <div class="form-group">
                    <label>Código de Barras / QR</label>
                    <div class="input-with-scanner">
                        <input type="text" id="cat-barcode">
                        <button type="button" class="btn-small" onclick="startScanner('cat-barcode')">📷</button>
                    </div>
                </div>
                <div class="form-group"><label>Descripción</label><input type="text" id="cat-desc"></div>
                <div class="form-group">
                    <label>Medidas (cm x cm x cm)</label>
                    <div class="measures-group">
                        <input type="number" step="0.1" id="cat-m1" placeholder="L"> x
                        <input type="number" step="0.1" id="cat-m2" placeholder="A"> x
                        <input type="number" step="0.1" id="cat-m3" placeholder="Al">
                    </div>
                </div>
                <div class="form-group"><label>Precio de Coste (€) *</label><input type="number" step="0.01" id="cat-coste" required></div>
                <div class="form-group"><label>Precio de Venta (€) *</label><input type="number" step="0.01" id="cat-venta" required></div>
                <div class="form-group"><label>Proveedor</label><input type="text" id="cat-prov"></div>
                <div class="form-group"><label>Núm. Justificante Compra</label><input type="text" id="cat-justificante"></div>
                <div class="form-group"><label>Fecha Alta</label><input type="date" id="cat-fecha"></div>
                <div class="form-group"><label>Foto del Producto</label><input type="file" id="cat-img" accept="image/*" onchange="previewCatalogImage(event)"></div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="cat-vendido" onchange="toggleBox('cat-vendido', 'box-cat-vendido')"> ¿Artículo Vendido?
                    </label>
                </div>

                <div id="box-cat-vendido" class="conditional-box">
                    <div class="form-grid">
                        <div class="form-group"><label>Núm. de Factura</label><input type="text" id="cat-factura"></div>
                        <div class="form-group"><label>Importe Total Factura (€)</label><input type="number" step="0.01" id="cat-imp-factura"></div>
                        <div class="form-group"><label>Transportista</label><input type="text" id="cat-transp"></div>
                        <div class="form-group"><label>Localizador de Envío</label><input type="text" id="cat-localizador"></div>
                        <div class="form-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="cat-entregado" onchange="toggleBox('cat-entregado', 'box-cat-entrega')"> ¿Entregado?
                            </label>
                        </div>
                        <div class="form-group" id="box-cat-entrega" style="display:none;">
                            <label>Fecha de Entrega</label><input type="date" id="cat-fecha-entrega">
                        </div>
                    </div>
                </div>
            </div>
            <button type="submit" class="btn-primary" style="width:100%">Guardar en Catálogo</button>
        </form>

        <!-- FORMULARIO 2: EMPRESA -->
        <form id="form-empresa" class="tab-form" onsubmit="saveRecord(event, 'empresa')" style="display:none;">
            <div class="form-grid">
                <div class="form-group"><label>Código / Ref</label><input type="text" id="emp-ref" placeholder="EMP-01"></div>
                <div class="form-group"><label>Nombre Comercial / Razón Social *</label><input type="text" id="emp-nombre" required></div>
                <div class="form-group"><label>NIF / CIF *</label><input type="text" id="emp-nif" placeholder="Ej: B12345678"></div>
                <div class="form-group"><label>Dirección Fiscal *</label><input type="text" id="emp-dir" placeholder="Calle, CP, Ciudad"></div>
                <div class="form-group"><label>Teléfono</label><input type="tel" id="emp-tel"></div>
                <div class="form-group"><label>Correo Electrónico / Web</label><input type="text" id="emp-email"></div>
                <div class="form-group"><label>Fecha Registro</label><input type="date" id="emp-fecha"></div>
            </div>
            <button type="submit" class="btn-primary" style="width:100%">Guardar Datos de Empresa</button>
        </form>

        <!-- FORMULARIO 3: PROVEEDORES -->
        <form id="form-proveedores" class="tab-form" onsubmit="saveRecord(event, 'proveedores')" style="display:none;">
            <div class="form-grid">
                <div class="form-group"><label>Código Proveedor *</label><input type="text" id="prov-ref" required></div>
                <div class="form-group"><label>Nombre *</label><input type="text" id="prov-nombre" required></div>
                <div class="form-group"><label>Dirección</label><input type="text" id="prov-dir"></div>
                <div class="form-group"><label>Teléfono</label><input type="tel" id="prov-tel"></div>
                <div class="form-group"><label>Correo</label><input type="email" id="prov-email"></div>
                <div class="form-group"><label>Web</label><input type="text" id="prov-web"></div>
                <div class="form-group"><label>Importe Facturado (€)</label><input type="number" step="0.01" id="prov-facturado" value="0"></div>
                <div class="form-group"><label>Importe Pagado (€)</label><input type="number" step="0.01" id="prov-pagado" value="0"></div>
                <div class="form-group"><label>Fecha Alta</label><input type="date" id="prov-fecha"></div>
                <div class="form-group"><label>Documentos Adjuntos</label><input type="file" id="prov-docs" multiple></div>
            </div>
            <button type="submit" class="btn-primary" style="width:100%">Guardar Proveedor</button>
        </form>

        <!-- FORMULARIO 4: CLIENTES -->
        <form id="form-clientes" class="tab-form" onsubmit="saveRecord(event, 'clientes')" style="display:none;">
            <div class="form-grid">
                <div class="form-group"><label>Código Cliente / NIF *</label><input type="text" id="cli-ref" required></div>
                <div class="form-group"><label>Nombre Completo / Razón Social *</label><input type="text" id="cli-nombre" required></div>
                <div class="form-group"><label>Dirección Completa</label><input type="text" id="cli-dir"></div>
                <div class="form-group"><label>Teléfono</label><input type="tel" id="cli-tel"></div>
                <div class="form-group"><label>Correo</label><input type="email" id="cli-email"></div>
                <div class="form-group"><label>Web / País</label><input type="text" id="cli-web"></div>
                <div class="form-group"><label>Importe Facturado (€)</label><input type="number" step="0.01" id="cli-facturado" value="0"></div>
                <div class="form-group"><label>Importe Cobrado (€)</label><input type="number" step="0.01" id="cli-cobrado" value="0"></div>
                <div class="form-group"><label>Fecha Alta</label><input type="date" id="cli-fecha"></div>
                <div class="form-group"><label>Documentos Adjuntos</label><input type="file" id="cli-docs" multiple></div>
            </div>
            <button type="submit" class="btn-primary" style="width:100%">Guardar Cliente</button>
        </form>

        <!-- FORMULARIO 5: COMPRAS -->
        <form id="form-compras" class="tab-form" onsubmit="saveRecord(event, 'compras')" style="display:none;">
            <div class="form-grid">
                <div class="form-group"><label>Referencia *</label><input type="text" id="comp-ref" required></div>
                <div class="form-group"><label>Nombre *</label><input type="text" id="comp-nombre" required></div>
                <div class="form-group"><label>SKU</label><input type="text" id="comp-sku"></div>
                <div class="form-group">
                    <label>Código de Barras / QR</label>
                    <div class="input-with-scanner">
                        <input type="text" id="comp-barcode">

                    </div>
                </div>
                <div class="form-group"><label>Proveedor</label><input type="text" id="comp-prov"></div>
                <div class="form-group"><label>Precio de Compra (€) *</label><input type="number" step="0.01" id="comp-precio" required></div>
                <div class="form-group"><label>Justificante de Compra</label><input type="text" id="comp-just"></div>
                <div class="form-group"><label>Unidades *</label><input type="number" id="comp-uds" value="1" required></div>

                <div class="form-group">

                </div>
            </div>
            <button type="submit" class="btn-primary" style="width:100%">Guardar Compra (Añade al Catálogo)</button>
        </form>

        <!-- FORMULARIO 6: VENTAS -->
        <form id="form-ventas" class="tab-form" onsubmit="saveRecord(event, 'ventas')" style="display:none;">
            <div class="form-grid">
                <div class="form-group" style="grid-column: 1 / -1;">
                    <label>Seleccionar Artículo del Catálogo (Autorrellena y sincroniza al guardar)</label>
                    <select id="ven-select-cat" onchange="autofillVenta()">
                        <option value="">-- Seleccionar artículo --</option>
                    </select>
                </div>
                <div class="form-group"><label>Núm. Factura *</label><input type="text" id="ven-factura" required placeholder="Ej: FAC-2026-001"></div>
                <div class="form-group"><label>Fecha Venta *</label><input type="date" id="ven-fecha" required></div>
                <div class="form-group"><label>Cliente *</label><input type="text" id="ven-cliente" required placeholder="Nombre del cliente"></div>
                <div class="form-group"><label>Referencia *</label><input type="text" id="ven-ref" required></div>
                <div class="form-group"><label>Nombre Artículo</label><input type="text" id="ven-nombre"></div>
                <div class="form-group"><label>SKU</label><input type="text" id="ven-sku"></div>
                <div class="form-group">
                    <label>Código de Barras / QR</label>
                    <div class="input-with-scanner">
                        <input type="text" id="ven-barcode">
                        <button type="button" class="btn-small" onclick="startScanner('ven-barcode')">📷</button>
                    </div>
                </div>
                <div class="form-group"><label>Precio Coste (€)</label><input type="number" step="0.01" id="ven-coste" value="0" oninput="calcRebu()"></div>
                <div class="form-group"><label>Precio de Venta (€) *</label><input type="number" step="0.01" id="ven-precio" value="0" required oninput="updateTotalVenta()"></div>
                <div class="form-group"><label>Gastos de Envío (€)</label><input type="number" step="0.01" id="ven-envio" value="0" oninput="updateTotalVenta()"></div>
                <div class="form-group"><label>Importe Total Venta (€)</label><input type="number" step="0.01" id="ven-total" value="0" readonly></div>
                <div class="form-group">
                    <label>Destino</label>
                    <select id="ven-destino" onchange="calcRebu()">
                        <option value="UE">UE (Calcula REBU)</option>
                        <option value="Otros">Otros (Exento REBU)</option>
                    </select>
                </div>
                <div class="form-group"><label>Base Imponible REBU</label><input type="text" id="ven-base-rebu" readonly></div>
                <div class="form-group"><label>IVA REBU (21%)</label><input type="text" id="ven-iva-rebu" readonly></div>
                
                <!-- CAMPOS DE ENVÍO Y ENTREGA (SE SINCRONIZAN CON CATÁLOGO) -->
                <div class="form-group"><label>Transporte / Transportista</label><input type="text" id="ven-transp"></div>
                <div class="form-group"><label>Localizador de Envío</label><input type="text" id="ven-localizador"></div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="ven-entregado" onchange="toggleBox('ven-entregado', 'box-ven-entrega')"> ¿Entregado?
                    </label>
                </div>
                <div class="form-group" id="box-ven-entrega" style="display:none;">
                    <label>Fecha de Entrega</label><input type="date" id="ven-fecha-entrega">
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="ven-pagado" onchange="toggleBox('ven-pagado', 'box-ven-pago')"> ¿Pagado?
                    </label>
                </div>
                <div class="form-group" id="box-ven-pago" style="display:none;">
                    <label>Fecha de Pago</label><input type="date" id="ven-fecha-pago">
                </div>
                <div class="form-group">
                    <label>Contabilizado</label>
                    <select id="ven-contab"><option value="No">No</option><option value="Sí">Sí</option></select>
                </div>

            <button type="submit" class="btn-primary" style="width:100%">Guardar Venta y Actualizar Catálogo</button>

        <!-- FORMULARIO 7: GASTOS -->
        <form id="form-gastos" class="tab-form" onsubmit="saveRecord(event, 'gastos')" style="display:none;">
            <div class="form-grid">
                <div class="form-group"><label>Núm. Gasto / Ref *</label><input type="text" id="gas-ref" required></div>
                <div class="form-group"><label>Fecha *</label><input type="date" id="gas-fecha" required></div>
                <div class="form-group"><label>Proveedor</label><input type="text" id="gas-prov"></div>
                <div class="form-group"><label>Descripción *</label><input type="text" id="gas-nombre" required></div>
                <div class="form-group"><label>Base Imponible (€)</label><input type="number" step="0.01" id="gas-base" value="0"></div>
                <div class="form-group"><label>IVA (€)</label><input type="number" step="0.01" id="gas-iva" value="0"></div>
                <div class="form-group"><label>Importe Total (€) *</label><input type="number" step="0.01" id="gas-total" required></div>
                <div class="form-group"><label>Justificante del Gasto</label><input type="file" id="gas-file"></div>

            <button type="submit" class="btn-primary" style="width:100%">Guardar Gasto</button>
        </form>
    </div>
</div>

<!-- MODAL DEL ESCÁNER DE CÓDIGO DE BARRAS Y QR -->
<div id="scanner-modal" class="modal-overlay">
    <div class="modal-box" style="max-width: 500px; text-align: center;">
        <div class="modal-header">
            <h3>📷 Escanear Código de Barras / QR</h3>
            <button class="btn-close" onclick="stopScanner()">✖</button>
        </div>
        <div id="reader"></div>
        <p style="margin-top:10px; font-size:0.85rem; color:var(--gold-light);">Apunta con la cámara al código del producto</p>
    </div>
</div>

<script>
    /* ==========================================================
       1. MANIFIESTO ANDROID E INICIALIZACIÓN DE DATOS
       ========================================================== */
    const manifestJSON = {
        "name": "CirCA by RB - Gestión",
        "short_name": "CirCA by RB",
        "start_url": "./index.html",
        "display": "standalone",
        "background_color": "#121212",
        "theme_color": "#121212",
        "icons": [
            { "src": new URL("Logo.jpg", window.location.href).href, "sizes": "192x192", "type": "image/jpeg" },
            { "src": new URL("Logo.jpg", window.location.href).href, "sizes": "512x512", "type": "image/jpeg" }
        ]
    };
    const blob = new Blob([JSON.stringify(manifestJSON)], {type: 'application/json'});
    document.querySelector('#my-manifest-placeholder').setAttribute('href', URL.createObjectURL(blob));

    let currentTab = 'catalogo';
    let editIndex = null;
    let tempImageBase64 = '';

    let db = JSON.parse(localStorage.getItem('circa_db_v2')) || {
        empresa: [{ ref: 'EMP-01', nombre: 'CirCA by RB', nif: '', dir: '', tel: '', email: 'www.circabyrb.com', fecha: '2026-01-01' }],
        catalogo: [],
        proveedores: [],
        clientes: [],
        compras: [],
        ventas: [],
        gastos: []
    };

    const tabTitles = {
        catalogo: '1. Catálogo de Artículos (Cuadrícula)',
        empresa: '2. Listado de Empresas',
        proveedores: '3. Listado de Proveedores',
        clientes: '4. Listado de Clientes',
        compras: '5. Listado de Compras',
        ventas: '6. Listado de Ventas y Facturación',
        gastos: '7. Listado de Gastos'
    };

    function saveDB() {
        localStorage.setItem('circa_db_v2', JSON.stringify(db));
        if (db.empresa.length > 0) {
            document.getElementById('active-company-display').innerText = "Empresa activa: " + db.empresa[db.empresa.length - 1].nombre;
        }
        renderCurrentTab();
    }

    /* ==========================================================
       2. NAVEGACIÓN, FILTROS Y ORDENACIÓN
       ========================================================== */
    function switchTab(tab, btn) {
        currentTab = tab;
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('section-title').innerText = tabTitles[tab];
        clearFilters();
    }

    function clearFilters() {
        document.getElementById('filter-search').value = '';
        document.getElementById('filter-date-from').value = '';
        document.getElementById('filter-date-to').value = '';
        document.getElementById('sort-field').value = 'none';
        document.getElementById('sort-dir').value = 'asc';
        renderCurrentTab();
    }

    function getFilteredAndSortedData() {
        const query = document.getElementById('filter-search').value.toLowerCase().trim();
        const dateFrom = document.getElementById('filter-date-from').value;
        const dateTo = document.getElementById('filter-date-to').value;
        const sortField = document.getElementById('sort-field').value;
        const sortDir = document.getElementById('sort-dir').value;

        let list = (db[currentTab] || []).map((item, originalIndex) => ({ ...item, _idx: originalIndex }));

        if (query) {
            list = list.filter(item =>
                Object.entries(item).some(([k, val]) =>
                    k !== 'imgData' && k !== '_idx' && String(val).toLowerCase().includes(query)
                )
            );
        }

        if (dateFrom) {
            list = list.filter(item => (item.fecha || '') >= dateFrom);
        }
        if (dateTo) {
            list = list.filter(item => (item.fecha || '') <= dateTo);
        }

        if (sortField !== 'none') {
            list.sort((a, b) => {
                let valA = String(a[sortField] || '').toLowerCase();
                let valB = String(b[sortField] || '').toLowerCase();
                let cmp = valA.localeCompare(valB, undefined, { numeric: true });
                return sortDir === 'asc' ? cmp : -cmp;
            });
        }

        return list;
    }

    /* ==========================================================
       3. RENDERIZADO DE CUADRÍCULA Y LISTADOS
       ========================================================== */
    function renderCurrentTab() {
        const container = document.getElementById('main-list-view');
        const data = getFilteredAndSortedData();

        if (data.length === 0) {
            container.innerHTML = `<div class="empty-msg">No hay registros que mostrar en esta sección. Pulsa "➕ Nuevo Registro" para empezar.</div>`;
            return;
        }

        // Vista de Cuadrícula para Catálogo
        if (currentTab === 'catalogo') {
            container.innerHTML = `<div class="catalog-grid">` + data.map(item => `
                <div class="catalog-card">
                    <div>
                        <img src="${item.imgData || 'Logo.jpg'}" class="catalog-img" alt="${item.nombre}" onerror="this.src='https://via.placeholder.com/300x200/1e1e1e/c5a059?text=CirCA+by+RB'">
                        <div class="catalog-body">
                            <span class="badge ${item.vendido === 'Vendido' ? 'badge-vendido' : 'badge-disponible'}">${item.vendido || 'Disponible'}</span>
                            <div class="catalog-ref">REF: ${item.ref} ${item.sku ? '| SKU: ' + item.sku : ''}</div>
                            <div class="catalog-title">${item.nombre}</div>
                            <div class="catalog-prices">
                                <span>Coste: <strong>${item.coste} €</strong></span>
                                <span style="color:var(--gold-light)">PVP: <strong>${item.venta} €</strong></span>
                            </div>
                            <div class="catalog-details">
                                <div>📏 Medidas: ${item.medidas}</div>
                                <div>🏷️ Cód. Barras: ${item.barcode || '-'}</div>
                                <div>🏢 Prov: ${item.prov || '-'} (Just: ${item.justificante || '-'})</div>
                                ${item.vendido === 'Vendido' ? `<div style="margin-top:6px; padding-top:6px; border-top:1px dashed var(--border-color); color:var(--gold-light);">📦 <strong>Venta sincronizada:</strong><br>Fact: ${item.factura || '-'} (${item.impFactura || 0}€)<br>Transp: ${item.transp || '-'} [${item.localizador || '-'}]<br>Entregado: ${item.entregado}</div>` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="card-actions" style="padding: 10px;">
                        <button class="btn-small" onclick="openFormModal(${item._idx})" title="Editar">✏️</button>
                        <button class="btn-small" onclick="exportSingleCSV(${item._idx})" title="Excel Individual">📊</button>
                        <button class="btn-small" onclick="printSinglePDF(${item._idx})" title="PDF Individual">🖨️</button>
                        <button class="btn-small" style="border-color:var(--danger); color:var(--danger);" onclick="deleteRecord(${item._idx})" title="Borrar">🗑️</button>
                    </div>
                </div>
            `).join('') + `</div>`;
            return;
        }

        // Vista de Listado para el resto de pestañas
        container.innerHTML = `<div class="list-container">` + data.map(item => {
            let fieldsHTML = '';
            let headerTitle = '';
            let pdfButtonLabel = currentTab === 'ventas' ? '🧾 Factura PDF' : '🖨️ PDF';

            if (currentTab === 'empresa') {
                headerTitle = `${item.ref || 'EMP'} - ${item.nombre}`;
                fieldsHTML = `
                    <div class="field-item"><strong>NIF / CIF</strong>${item.nif || '-'}</div>
                    <div class="field-item"><strong>Dirección Fiscal</strong>${item.dir || '-'}</div>
                    <div class="field-item"><strong>Teléfono</strong>${item.tel || '-'}</div>
                    <div class="field-item"><strong>Email / Web</strong>${item.email || '-'}</div>
                    <div class="field-item"><strong>Fecha</strong>${item.fecha || '-'}</div>`;
            } else if (currentTab === 'proveedores') {
                headerTitle = `${item.ref} - ${item.nombre}`;
                fieldsHTML = `
                    <div class="field-item"><strong>Dirección</strong>${item.dir || '-'}</div>
                    <div class="field-item"><strong>Teléfono</strong>${item.tel || '-'}</div>
                    <div class="field-item"><strong>Correo / Web</strong>${item.email || '-'} / ${item.web || '-'}</div>
                    <div class="field-item"><strong>Importe Facturado</strong>${item.facturado} €</div>
                    <div class="field-item"><strong>Importe Pagado</strong>${item.pagado} €</div>
                    <div class="field-item"><strong>Documentos</strong>${item.docs || '-'}</div>`;
            } else if (currentTab === 'clientes') {
                headerTitle = `${item.ref} - ${item.nombre}`;
                fieldsHTML = `
                    <div class="field-item"><strong>Dirección</strong>${item.dir || '-'}</div>
                    <div class="field-item"><strong>Teléfono</strong>${item.tel || '-'}</div>
                    <div class="field-item"><strong>Correo / Web</strong>${item.email || '-'} / ${item.web || '-'}</div>
                    <div class="field-item"><strong>Importe Facturado</strong>${item.facturado} €</div>
                    <div class="field-item"><strong>Importe Cobrado</strong>${item.cobrado} €</div>
                    <div class="field-item"><strong>Documentos</strong>${item.docs || '-'}</div>`;
            } else if (currentTab === 'compras') {
                headerTitle = `REF: ${item.ref} - ${item.nombre}`;
                fieldsHTML = `
                    <div class="field-item"><strong>SKU / Cód. Barras</strong>${item.sku || '-'} / ${item.barcode || '-'}</div>
                    <div class="field-item"><strong>Proveedor</strong>${item.prov || '-'}</div>
                    <div class="field-item"><strong>Precio Compra</strong>${item.precio} € (x${item.uds} uds)</div>
                    <div class="field-item"><strong>Justificante</strong>${item.just || '-'}</div>
                    <div class="field-item"><strong>Fecha</strong>${item.fecha || '-'}</div>
                    <div class="field-item"><strong>Contabilizado</strong>${item.contab}</div>`;
            } else if (currentTab === 'ventas') {
                headerTitle = `Factura: ${item.factura} | REF: ${item.ref} - ${item.nombre}`;
                fieldsHTML = `
                    <div class="field-item"><strong>Fecha / Cliente</strong>${item.fecha} | ${item.cliente}</div>
                    <div class="field-item"><strong>SKU / Cód. Barras</strong>${item.sku || '-'} / ${item.barcode || '-'}</div>
                    <div class="field-item"><strong>P. Venta + Envío</strong>${item.precio}€ + ${item.envio}€ = <strong>${item.total}€</strong></div>
                    <div class="field-item"><strong>Destino y REBU</strong>${item.destino} | Base: ${item.baseRebu} | IVA: ${item.ivaRebu}</div>
                    <div class="field-item"><strong>Transporte y Localizador</strong>${item.transp || '-'} (${item.localizador || '-'})</div>
                    <div class="field-item"><strong>Entregado</strong>${item.entregado}</div>
                    <div class="field-item"><strong>Pagado / Contab.</strong>${item.pagado} | Contab: ${item.contab}</div>`;
            } else if (currentTab === 'gastos') {
                headerTitle = `Gasto Nº ${item.ref} - ${item.nombre}`;
                fieldsHTML = `
                    <div class="field-item"><strong>Fecha</strong>${item.fecha || '-'}</div>
                    <div class="field-item"><strong>Proveedor</strong>${item.prov || '-'}</div>
                    <div class="field-item"><strong>Base Imponible</strong>${item.base} €</div>
                    <div class="field-item"><strong>IVA</strong>${item.iva} €</div>
                    <div class="field-item"><strong>Importe Total</strong><strong>${item.total} €</strong></div>
                    <div class="field-item"><strong>Justificante</strong>${item.file || '-'}</div>`;
            }

            return `
            <div class="list-card">
                <div class="list-card-header">
                    <span class="list-card-title">${headerTitle}</span>
                </div>
                <div class="list-card-grid">${fieldsHTML}</div>
                <div class="card-actions">
                    <button class="btn-small" onclick="openFormModal(${item._idx})">✏️ Editar</button>
                    <button class="btn-small" onclick="exportSingleCSV(${item._idx})">📊 Excel</button>
                    <button class="btn-small" onclick="printSinglePDF(${item._idx})">${pdfButtonLabel}</button>
                    <button class="btn-small" style="border-color:var(--danger); color:var(--danger);" onclick="deleteRecord(${item._idx})">🗑️ Borrar</button>
                </div>
            </div>`;
        }).join('') + `</div>`;
    }

    /* ==========================================================
       4. GESTIÓN DE FORMULARIOS Y SINCRONIZACIÓN AUTOMÁTICA
       ========================================================== */
    function toggleBox(checkId, boxId) {
        document.getElementById(boxId).style.display = document.getElementById(checkId).checked ? 'block' : 'none';
    }

    function previewCatalogImage(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const maxW = 400;
                const scale = maxW / img.width;
                canvas.width = maxW;
                canvas.height = img.height * scale;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                tempImageBase64 = canvas.toDataURL('image/jpeg', 0.75);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function openFormModal(index = null) {
        editIndex = index;
        tempImageBase64 = '';
        document.querySelectorAll('.tab-form').forEach(f => { f.style.display = 'none'; f.reset(); });
        
        const activeForm = document.getElementById('form-' + currentTab);
        activeForm.style.display = 'block';
        document.getElementById('modal-title').innerText = index === null ? `➕ Nuevo Registro (${currentTab.toUpperCase()})` : `✏️ Editar Registro (${currentTab.toUpperCase()})`;

        if (currentTab === 'ventas') {
            document.getElementById('ven-select-cat').innerHTML = '<option value="">-- Seleccionar artículo --</option>' +
                db.catalogo.map((x, i) => `<option value="${i}">${x.ref} - ${x.nombre} (${x.venta}€)</option>`).join('');
        }

        if (index !== null) {
            const item = db[currentTab][index];
            if (currentTab === 'catalogo') {
                document.getElementById('cat-ref').value = item.ref || '';
                document.getElementById('cat-sku').value = item.sku || '';
                document.getElementById('cat-nombre').value = item.nombre || '';
                document.getElementById('cat-barcode').value = item.barcode || '';
                document.getElementById('cat-desc').value = item.desc || '';
                const m = (item.medidas || '0x0x0').replace(' cm','').split('x');
                document.getElementById('cat-m1').value = m[0] || 0;
                document.getElementById('cat-m2').value = m[1] || 0;
                document.getElementById('cat-m3').value = m[2] || 0;
                document.getElementById('cat-coste').value = item.coste || 0;
                document.getElementById('cat-venta').value = item.venta || 0;
                document.getElementById('cat-prov').value = item.prov || '';
                document.getElementById('cat-justificante').value = item.justificante || '';
                document.getElementById('cat-fecha').value = item.fecha || '';
                tempImageBase64 = item.imgData || '';
                document.getElementById('cat-vendido').checked = item.vendido === 'Vendido';
                toggleBox('cat-vendido', 'box-cat-vendido');
                document.getElementById('cat-factura').value = item.factura || '';
                document.getElementById('cat-imp-factura').value = item.impFactura || '';
                document.getElementById('cat-transp').value = item.transp || '';
                document.getElementById('cat-localizador').value = item.localizador || '';
                const isEntregado = item.entregado && item.entregado.startsWith('Sí');
                document.getElementById('cat-entregado').checked = isEntregado;
                toggleBox('cat-entregado', 'box-cat-entrega');
                if (isEntregado) {
                    const matchFecha = item.entregado.match(/\((.*?)\)/);
                    if (matchFecha) document.getElementById('cat-fecha-entrega').value = matchFecha[1];
                }
            } else if (currentTab === 'empresa') {
                document.getElementById('emp-ref').value = item.ref || '';
                document.getElementById('emp-nombre').value = item.nombre || '';
                document.getElementById('emp-nif').value = item.nif || '';
                document.getElementById('emp-dir').value = item.dir || '';
                document.getElementById('emp-tel').value = item.tel || '';
                document.getElementById('emp-email').value = item.email || '';
                document.getElementById('emp-fecha').value = item.fecha || '';
            } else if (currentTab === 'proveedores') {
                document.getElementById('prov-ref').value = item.ref || '';

    function autofillVenta() {
        const index = document.getElementById('ven-select-cat').value;
        if (index === "") return;
        const item = db.catalogo[index];
        document.getElementById('ven-ref').value = item.ref || '';
        document.getElementById('ven-nombre').value = item.nombre || '';
        document.getElementById('ven-sku').value = item.sku || '';
        document.getElementById('ven-barcode').value = item.barcode || '';
        document.getElementById('ven-coste').value = item.coste || 0;
        document.getElementById('ven-precio').value = item.venta || 0;
        updateTotalVenta();
    }

    function updateTotalVenta() {
        const precio = parseFloat(document.getElementById('ven-precio').value) || 0;
        const envio = parseFloat(document.getElementById('ven-envio').value) || 0;
        document.getElementById('ven-total').value = (precio + envio).toFixed(2);
        calcRebu();
    }

    function calcRebu() {
        const destino = document.getElementById('ven-destino').value;
        const totalVenta = parseFloat(document.getElementById('ven-total').value) || 0;
        const precioCoste = parseFloat(document.getElementById('ven-coste').value) || 0;

        if (destino === 'UE') {
            const base = (totalVenta - precioCoste) / 1.21;
            const rebu = base * 0.21;
            document.getElementById('ven-base-rebu').value = base.toFixed(2) + ' €';
            document.getElementById('ven-iva-rebu').value = rebu.toFixed(2) + ' €';
        } else {
            document.getElementById('ven-base-rebu').value = '0.00 € (Exento)';
            document.getElementById('ven-iva-rebu').value = '0.00 € (Exento)';
        }
    }

    /* ==========================================================
       6. LECTOR DE CÓDIGO DE BARRAS Y QR (CÁMARA)
       ========================================================== */
    let html5QrCode = null;
    let targetBarcodeInput = '';

    function startScanner(inputId) {
        targetBarcodeInput = inputId;
        document.getElementById('scanner-modal').style.display = 'flex';
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 150 } },
            (decodedText) => {
                document.getElementById(targetBarcodeInput).value = decodedText;
                stopScanner();
            },
            (errorMessage) => { }
        ).catch(err => {
            alert("No se pudo acceder a la cámara. Asegúrate de dar permiso en el navegador.");
            stopScanner();
        });
    }

    function stopScanner() {
        if (html5QrCode) {
            html5QrCode.stop().then(() => {
                html5QrCode.clear();
                document.getElementById('scanner-modal').style.display = 'none';
            }).catch(() => {
                document.getElementById('scanner-modal').style.display = 'none';
            });
        } else {
            document.getElementById('scanner-modal').style.display = 'none';
        }
    }

       ========================================================== */
    function downloadCSV(rows, filename) {
        if (!rows || rows.length === 0) return alert("No hay datos para exportar.");
        const keys = Object.keys(rows[0]).filter(k => k !== 'imgData' && k !== '_idx');
        const csvContent = "\uFEFF" + [
            keys.join(";"),
            ...rows.map(r => keys.map(k => `"${String(r[k] ?? '').replace(/"/g, '""')}"`).join(";"))
        ].join("\n");

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        link.click();
    }

    function exportSectionCSV() {
        const data = getFilteredAndSortedData();
        downloadCSV(data, `CirCA_${currentTab}_listado.csv`);
    }

                .map(([k, v]) => `<div><strong>${k.toUpperCase()}:</strong> ${v || '-'}</div>`)
                .join('');
            return `<div class="card">${item.imgData ? `<img src="${item.imgData}" style="max-height:110px; border-radius:6px; margin-bottom:8px;">` : ''}<div class="grid">${entries}</div></div>`;
        }).join('');

        win.document.write(`
            <html><head><title>${title}</title>
            <style>
                body { font-family: Georgia, serif; padding: 20px; color: #121212; }
                .top { display: flex; align-items: center; gap: 15px; border-bottom: 2px solid #C5A059; padding-bottom: 10px; margin-bottom: 15px; }
                .top img { width: 55px; height: 55px; border-radius: 50%; border: 1px solid #C5A059; object-fit: cover; }
                .card { border: 1px solid #8C6D32; border-radius: 6px; padding: 12px; margin-bottom: 15px; page-break-inside: avoid; }
                .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; font-family: sans-serif; font-size: 12px; }
            </style></head>
            <body>
                <div class="top">
                    <img src="${logoUrl}" onerror="this.style.display='none'">
                    <h1>CIRCA BY R.B - ${title}</h1>
                </div>
                ${rowsHTML}
                <script>window.onload = function() { window.print(); }<\/script>
            </body></html>
        `);
        win.document.close();
    }

    /* ==========================================================
       8. COPIAS DE SEGURIDAD (JSON)
       ========================================================== */
    function exportarDatos() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
        const a = document.createElement('a');
        a.href = dataStr;
        a.download = "datos_circa_by_rb.json";
        a.click();
    }

    function importarDatos(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                db = JSON.parse(e.target.result);
                saveDB();
                alert("¡Copia de seguridad cargada con éxito!");
            } catch (err) {
                alert("Archivo inválido.");
            }
        };
        reader.readAsText(file);
    }

    renderCurrentTab();
</script>
